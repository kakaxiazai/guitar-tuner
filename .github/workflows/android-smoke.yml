name: Android 云冒烟 + 调音自检

# 全云端验证，不需要本地 Android SDK，也不需要真机：
#   1) 取得 APK（EAS 云端构建，或直接用给定的 apk_url）
#   2) GitHub 云端模拟器安装 → 启动 → 截图 → 抓 logcat → 崩溃判定
#   3) 深链拉起「调音器自检」，用合成信号断言核心链路（音名 / 音分）
#
# 未配置 EXPO_TOKEN 且未提供 apk_url 时，会输出提示并**跳过**，不会让 CI 变红。
# 配置说明见仓库根目录 CLOUD_CI.md

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: '现成 APK 的下载地址（留空则触发一次新的 EAS 云端构建）'
        required: false
        default: ''
        type: string
  schedule:
    # 每周一 03:00（北京时间，即周日 19:00 UTC）
    - cron: '0 19 * * 0'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'patches/**'
      - 'scripts/ci/**'
      - '.github/workflows/android-smoke.yml'

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 云端构建 + 冒烟 + 调音自检
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 判定 APK 来源
        id: plan
        env:
          APK_URL: ${{ inputs.apk_url }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$APK_URL" ]; then
            echo "source=url" >> "$GITHUB_OUTPUT"
            echo "APK 来源：外部 URL"
          elif [ -n "$EXPO_TOKEN" ]; then
            echo "source=eas" >> "$GITHUB_OUTPUT"
            echo "APK 来源：EAS 云端构建"
          else
            echo "source=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 EXPO_TOKEN 且未提供 apk_url，跳过本次云端验证。配置方法见 CLOUD_CI.md"
          fi

      - uses: actions/checkout@v4
        if: steps.plan.outputs.source != 'skip'

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.source == 'eas'
        with:
          node-version: 22

      - name: 下载指定 APK
        if: steps.plan.outputs.source == 'url'
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          mkdir -p apk
          curl -fL --retry 3 --retry-delay 5 "$APK_URL" -o apk/app.apk
          ls -lh apk/

      - name: EAS 云端构建并下载产物
        if: steps.plan.outputs.source == 'eas'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npm i -g eas-cli@latest
          eas --version
          mkdir -p apk
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('build.json','utf8'));const r=Array.isArray(b)?b[b.length-1]:b;fs.writeFileSync('apk-url.txt',r.artifacts.applicationArchiveUrl)"
          echo "产物地址: $(cat apk-url.txt)"
          curl -fL --retry 3 --retry-delay 5 "$(cat apk-url.txt)" -o apk/app.apk
          ls -lh apk/

      - name: 启用 KVM 硬件加速
        if: steps.plan.outputs.source != 'skip'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: 运行冒烟测试与调音自检
        if: steps.plan.outputs.source != 'skip'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            set +e
            bash scripts/ci/emulator-smoke.sh apk/app.apk
            SMOKE=$?
            bash scripts/ci/tuner-selftest.sh
            SELFTEST=$?
            echo "-------------------------------------------"
            echo "启动冒烟: $SMOKE (0=通过)"
            echo "调音自检: $SELFTEST (0=通过)"
            [ "$SMOKE" -eq 0 ] && [ "$SELFTEST" -eq 0 ]

      - name: 上传证据（截图 / 日志 / 自检输出）
        if: always() && steps.plan.outputs.source != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: smoke-out/
          if-no-files-found: warn
          retention-days: 14

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "## Android 云端验证"
            echo ""
            if [ "${{ steps.plan.outputs.source }}" = "skip" ]; then
              echo "未配置 \`EXPO_TOKEN\` 且未提供 \`apk_url\`，本次已跳过。配置方法见 \`CLOUD_CI.md\`。"
            else
              echo "- 触发来源: \`${{ github.event_name }}\`"
              echo "- APK 来源: \`${{ steps.plan.outputs.source }}\`"
              echo "- 安装: $(grep -c 'Success' smoke-out/install.txt 2>/dev/null || echo 0) 条 Success"
              echo "- 进程: $(cat smoke-out/pid.txt 2>/dev/null || echo '无')"
              echo ""
              echo "### 调音器自检（合成信号 → 音名 / 音分）"
              echo ""
              echo '```'
              sed -n 's/^.*TUNER_SELFTEST_SUMMARY /摘要: /p' smoke-out/selftest-logcat.txt 2>/dev/null | tail -1 || true
              grep -F 'TUNER_SELFTEST case=' smoke-out/selftest-logcat.txt 2>/dev/null \
                | sed 's/^.*TUNER_SELFTEST //' || true
              echo '```'
              echo ""
              echo "证据见 artifact \`smoke-evidence\`（01-launch.png / 02-tuner-tab.png / logcat.txt / selftest-logcat.txt）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
